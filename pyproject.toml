[project]
name = "netcup-dyndns-and-trusted-proxies-updater"
version = "1.5.0"
description = "Netcup DynDns and Nexcloud Trusted Proxies Updater"
authors = [{ name = "Massoud Ahmed" }]
readme = "README.md"
requires-python = ">=3.13"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Internet :: Name Service (DNS)",
]
dependencies = [
    "requests>=2.34.2",
    "tqdm>=4.70.1",
]

[project.urls]
Repository = "https://github.com/sowoi/netcup-dyndns-and-trusted-proxies-updater"

[project.scripts]
netcup-dyndns = "src.netcup_dyndns:cli"

[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["src"]

[tool.setuptools.package-data]
src = ["netcup-dyndns.py"]

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.17.0",
    "requests>=2.34.2",
    "ruff>=0.17.3",
]
