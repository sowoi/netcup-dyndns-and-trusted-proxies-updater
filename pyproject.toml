[project]
name = "netcup-dyndns-and-trusted-proxies-updater"
version = "1.1.0"
description = "Netcup DynDns and Nexcloud Trusted Proxies Updater"
authors = [{ name = "Massoud Ahmed" }]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "requests>=2.32.3",
    "tqdm>=4.70.0",
]

[project.urls]
Repository = "https://github.com/sowoi/netcup-dyndns-and-trusted-proxies-updater"

[project.scripts]
netcup-dyndns = "src.netcup_dyndns:cli"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["src"]

[tool.setuptools.package-data]
src = ["netcup-dyndns.py"]

[dependency-groups]
dev = [
    "pre-commit>=4.2.0",
    "pytest>=8.3.5",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.0",
    "requests>=2.32.3",
    "ruff>=0.11.2",
]
